[workspace]
members = ["hex-dump", "hex-instset", "hex-packet", "hex-prog", "hex-verif"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
toml = "0.8"
askama = "0.12"
ctrlc = "3.4"

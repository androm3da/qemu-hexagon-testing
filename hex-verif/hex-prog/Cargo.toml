[package]
name = "hex-prog"
version = "0.1.0"
edition = "2021"

[dependencies]
hex-dump = { path = "../hex-dump" }
hex-instset = { path = "../hex-instset" }
hex-packet = { path = "../hex-packet" }
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# Scalar ALU + memory + software loops + calls/returns + forward branches
[generation]
num_packets = 50
num_iterations = 3

[synthesis]
max_packet_size = 4
allow_mem_ops = true
allow_control_flow = true
allow_sw_loops = true
allow_calls = true

[filters]
exclude = [
    "is solo",
    "is call or is return",
    "has side_effects",
    "is predicated_new",
    "is cvi",
    "type is TypeJ or type is TypeCJ or type is TypeNCJ or type is TypeCR",
]
include = "type is TypeLD or type is TypeST or type is TypeALU32_2op or type is TypeALU32_3op or type is TypeALU32_ADDI or type is TypeALU64 or type is TypeS_2op or type is TypeS_3op or type is TypeM or type is TypeXTYPE"
blocked_features = [
    "UseAudio", "UseCompound", "UseCabac", "UseZReg",
    "HasV81", "UseHVXV79", "UseHVXV81",
    "UseHVXFloatingPoint", "UseHVXIEEEFP", "UseHVXQFloat",
]
skip_terms = [
    "dckill", "l2kill", "l2cleanidx", "l2invidx", "l2gunlock", "dctag", "dcinva", "dccleana", "dccleaninva", "ictag", "icdatar", "l2tag", "l2gclean", "l2cleaninv", "l2unlock", "l2lock", "l2fetch", "dcclean", "dcinv", "dczero", "dcfetch", "icinv", "syncht", "swi", "trap", "jump", "call", "dealloc",
    "allocframe", "r29", "r30", "r31", "loop",
    "nmi", "stop", "rte", "wait", ":deprecated",
]
